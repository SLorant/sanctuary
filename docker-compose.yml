services:
  sanctuary:
    build: .
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      # Must match how you reach the app publicly (domain or http://VPS_IP:3000).
      # SvelteKit form actions reject requests whose Origin doesn't match this.
      - ORIGIN=http://YOUR_VPS_IP_OR_DOMAIN:3000
    volumes:
      - ./data:/app/data
